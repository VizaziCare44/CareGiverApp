name: Playwright tests and production deploy

# DEV-024/DEV-025: quality gate for the account/booking flow (FD-ACC
# §10/§12), and the only path to production (see vercel.json — Vercel's own
# git-triggered auto-deploy is disabled for main). Runs on every push and PR
# against a temporary local Supabase stack started from backend-config's
# migrations — thrown away with the runner, so no test data ever reaches a
# hosted project (the FD-VERIFY log tables are append-only; rows written to a
# shared project could never be removed). No separate staging environment,
# per FD-ACC §10. Fallback if the local stack proves unworkable: run against
# the shared dev project (DEV-003) with the idempotent seed from
# Test_Data_Strategy.md §4.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      # backend-config lives in VizaziCare44/CareGiverApp, which is public,
      # so no read credential is needed.
      - name: Check out backend-config
        uses: actions/checkout@v4
        with:
          repository: VizaziCare44/CareGiverApp
          path: backend-config-src

      # supabase-js (used by the test helpers) needs Node's native WebSocket,
      # which arrived in Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # A fresh runner means a fresh database: start applies every migration
      # to an empty Postgres. Only the services the app touches are started.
      - name: Start local Supabase
        working-directory: backend-config-src/backend-config
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,storage-api,realtime,postgres-meta

      # The local stack's keys are fixed, well-known development values, not
      # secrets; they are exported only for this job.
      - name: Export local Supabase connection
        working-directory: backend-config-src/backend-config
        run: |
          supabase status -o env > /tmp/supabase.env
          get() { grep "^$1=" /tmp/supabase.env | head -1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Supabase logs on failure
        if: failure()
        run: |
          docker ps --format '{{.Names}}\t{{.Status}}'
          docker logs supabase_auth_vizazi-care 2>&1 | tail -60 || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-production:
    # DEV-025: production only goes live after this suite passes. vercel.json
    # disables Vercel's own git-triggered auto-deploy for main — this job is
    # the only path to production now. Needs VERCEL_TOKEN, VERCEL_ORG_ID,
    # VERCEL_PROJECT_ID as repo secrets (not set by this workflow).
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
