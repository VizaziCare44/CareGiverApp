name: Playwright tests and production deploy

# DEV-024/DEV-025: quality gate for the account/booking flow (FD-ACC
# §10/§12), and the gate in front of production (see deploy-production below
# and vercel.json). Runs on every push and PR
# against a temporary local Supabase stack started from backend-config's
# migrations — thrown away with the runner, so no test data ever reaches a
# hosted project (the FD-VERIFY log tables are append-only; rows written to a
# shared project could never be removed). No separate staging environment,
# per FD-ACC §10. Fallback if the local stack proves unworkable: run against
# the shared dev project (DEV-003) with the idempotent seed from
# Test_Data_Strategy.md §4.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      # backend-config lives in VizaziCare44/CareGiverApp, which is public,
      # so no read credential is needed.
      - name: Check out backend-config
        uses: actions/checkout@v4
        with:
          repository: VizaziCare44/CareGiverApp
          path: backend-config-src

      # supabase-js (used by the test helpers) needs Node's native WebSocket,
      # which arrived in Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # A fresh runner means a fresh database: start applies every migration
      # to an empty Postgres. Only the services the app touches are started.
      - name: Start local Supabase
        working-directory: backend-config-src/backend-config
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,storage-api,realtime,postgres-meta

      # pgTAP tests in backend-config/supabase/tests/database: grants, RLS,
      # triggers and private functions, which the browser tests cannot reach.
      - name: Database tests
        working-directory: backend-config-src/backend-config
        run: supabase test db

      # The local stack's keys are fixed, well-known development values, not
      # secrets; they are exported only for this job.
      - name: Export local Supabase connection
        working-directory: backend-config-src/backend-config
        run: |
          supabase status -o env > /tmp/supabase.env
          get() { grep "^$1=" /tmp/supabase.env | head -1 | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # DEV-056: the same one command a developer runs (tests/README.md): reset the local
      # database from the migrations, seed the starter set with a password made up for this
      # run (masked, kept nowhere), then run Playwright, whose setup project signs each
      # seeded user in once (DEV-055).
      - name: Reset, seed and run the tests (npm run e2e:fresh)
        run: npm run e2e:fresh

      - name: Supabase logs on failure
        if: failure()
        run: |
          docker ps --format '{{.Names}}\t{{.Status}}'
          docker logs supabase_auth_vizazi-care 2>&1 | tail -60 || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-production:
    # DEV-025: production only goes live after the suite above passes. Once
    # vercel.json turns off Vercel's own git-triggered deploy for main, this
    # job is the only path to production: it calls a Vercel deploy hook, and
    # Vercel builds main from the connected repo (VizaziCare44/CareGiverApp).
    # A deploy hook is a single secret and creates no CLI deployment, so it
    # avoids the commit-author permission check that blocks CLI deploys.
    # Needs the repo secret VERCEL_DEPLOY_HOOK_URL (Vercel project -> Settings
    # -> Git -> Deploy Hooks, branch main).
    needs: test
    if: github.repository == 'VizaziCare44/CareGiverApp' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger production deploy
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set. Create a deploy hook for branch main in the Vercel project and add it as a repo secret; until then nothing deploys through this gate."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Production deploy requested for $GITHUB_SHA"
